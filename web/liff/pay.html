<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
<title>จ่ายเงิน — PayYet</title>
<link rel="icon" type="image/png" href="../img/favicon-48.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e5e7eb; --accent:#06c755; --warn:#d9480f; --ok:#1a9c4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f24; --text:#e8eaed; --muted:#9aa3ad; --line:#2d333b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:0 16px 16px; }
  .brand { max-width:480px; margin:0 auto; padding:14px 16px 8px; display:flex; align-items:center; gap:10px; }
  .brand img { width:44px; height:44px; border-radius:12px; }
  .brand span { font-weight:800; font-size:18px; letter-spacing:-.01em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0 0 2px; }
  .muted { color:var(--muted); font-size:14px; }
  .amount { font-size:32px; font-weight:700; margin:4px 0; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; font-size:15px; }
  .qr { display:block; width:240px; max-width:100%; margin:8px auto; border-radius:8px; background:#fff; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
  input[type=number] { width:100%; padding:10px 12px; font-size:18px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  button { width:100%; padding:12px; font-size:17px; font-weight:600; border:0; border-radius:12px; background:var(--accent); color:#fff; margin-top:12px; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); margin-top:8px; font-weight:500; }
  button:disabled { opacity:.5; }
  .msg { padding:10px 12px; border-radius:10px; margin-top:12px; font-size:15px; }
  .msg.ok { background:rgba(26,156,74,.12); color:var(--ok); }
  .msg.err { background:rgba(217,72,15,.12); color:var(--warn); }
  .status-PAID, .ok { color:var(--ok); } .status-REJECTED { color:var(--warn); }
  a, .link { color:var(--accent); }
  .pick-amount { font-size:24px; line-height:1.3; }
  .pick-row { display:flex; align-items:center; gap:12px; width:100%; padding:8px 0; background:none; border:0; border-radius:0; color:var(--text); font:inherit; font-weight:400; text-align:left; margin:0; cursor:pointer; }
  .pick-row.static { cursor:default; }
  .pick-row + .pick-row { border-top:1px solid var(--line); }
  .group-row { padding:10px 0; }
  .pick-row input[type=checkbox] { width:22px; height:22px; flex:0 0 auto; }
  .grow { flex:1 1 auto; min-width:0; }
  .block { display:block; font-size:13px; }
  .chev { font-size:26px; color:var(--muted); }
  .avatar { width:44px; height:44px; flex:0 0 44px; border-radius:50%; overflow:hidden; background:var(--line); display:inline-flex; align-items:center; justify-content:center; }
  .avatar.sq { border-radius:12px; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.ph { font-weight:700; font-size:18px; color:var(--text); background:#ffe9c7; }
  @media (prefers-color-scheme: dark) { .avatar.ph { background:#3b2810; } }

  /* ---------- app-like layout on every screen ---------- */
  html { -webkit-text-size-adjust:100%; }
  body { -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
         padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .brand { position:sticky; top:0; z-index:10; max-width:none; margin:0; background:var(--card); border-bottom:1px solid var(--line);
           padding:calc(10px + env(safe-area-inset-top)) max(16px, calc((100% - 560px) / 2 + 16px)) 10px; }
  main { max-width:560px; padding:16px; }
  input[type=number], input[type=file] { font-size:16px; min-height:48px; } /* >=16px stops iOS zoom-on-focus */
  input[type=file] { width:100%; padding:10px 0; }
  button { min-height:52px; touch-action:manipulation; cursor:pointer; }
  button:active { transform:scale(.98); }
  .amount { font-size:clamp(30px,9vw,40px); }
  .qr { width:min(280px,80%); }

  /* tablet / desktop: centred "sheet" so it never stretches edge to edge */
  @media (min-width:600px) {
    main { padding:24px 16px 32px; }
    .card { padding:20px; border-radius:18px; }
  }
  @media (min-width:1024px) {
    body { background:var(--bg); }
    main { margin-top:8px; }
  }
  /* phone: keep the submit button reachable at the bottom of the screen */
  @media (max-width:599px) {
    main { padding-bottom:24px; }
    .card button:not(.secondary) { position:sticky; bottom:calc(12px + env(safe-area-inset-bottom)); box-shadow:0 6px 18px rgba(0,0,0,.18); }
  }
  @media (prefers-reduced-motion:reduce) { button:active { transform:none; } }
</style>
</head>
<body>
<div class="brand"><img src="../img/logo-256.webp" width="44" height="44" alt=""><span>PayYet</span></div>
<main id="app"><div class="card muted">กำลังโหลด…</div></main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var API = 'https://api.drivetodev.online/'; // the API lives on its own subdomain (CORS allows this origin)
  var app = document.getElementById('app');
  var idToken = null, billToken = null, state = null;

  // Build DOM with textContent only: names and titles come from other users.
  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'class') e.className = props[k];
      else if (k === 'text') e.textContent = props[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function baht(satang) {
    var v = satang / 100;
    return v.toLocaleString('th-TH', { minimumFractionDigits: satang % 100 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function show(nodes) { app.replaceChildren.apply(app, nodes); }
  function fail(text) { show([el('div', { class: 'card' }, [el('div', { class: 'msg err', text: text })])]); }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + idToken }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด (' + r.status + ')'));
        return j;
      });
    });
  }

  // Shrink the slip photo on the phone before upload (max 1600 px JPEG).
  function shrink(file) {
    if (!window.createImageBitmap) return Promise.resolve(file);
    return createImageBitmap(file).then(function (img) {
      var s = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (res) { c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.85); });
    }).catch(function () { return file; });
  }

  function render() {
    var d = state, nodes = [];
    var head = el('div', { class: 'card' }, [
      el('h1', { text: 'จ่ายเงินให้ ' + d.collector }),
      el('div', { class: 'muted', text: d.title }),
      el('div', { class: 'amount', text: '฿' + baht(d.remainingSatang) }),
      el('div', { class: 'muted', text: d.paidSatang > 0 ? 'ยอดรวม ฿' + baht(d.amountSatang) + ' · จ่ายแล้ว ฿' + baht(d.paidSatang) : 'ยอดที่ต้องจ่าย' })
    ]);
    nodes.push(head);

    if (d.charges && d.charges.length) {
      nodes.push(el('div', { class: 'card' }, d.charges.map(function (c) {
        return el('div', { class: 'row' }, [el('span', { text: c.title }), el('span', { text: '฿' + baht(c.total) })]);
      })));
    }

    if (d.remainingSatang <= 0) {
      nodes.push(el('div', { class: 'card' }, [el('div', { class: 'msg ok', text: '✅ คุณจ่ายครบแล้ว ขอบคุณครับ' })]));
    } else if (d.billStatus !== 'OPEN') {
      nodes.push(el('div', { class: 'card' }, [el('div', { class: 'msg err', text: 'บิลนี้ปิดแล้ว' })]));
    } else {
      if (d.qr) {
        var qrCard = el('div', { class: 'card' }, [
          el('div', { class: 'muted', text: 'สแกนด้วยแอปธนาคาร (กดค้างที่รูปเพื่อบันทึก QR)' }),
          el('img', { class: 'qr', src: d.qr, alt: 'PromptPay QR' })
        ]);
        nodes.push(qrCard);
      }
      if (d.itemStatus === 'SUBMITTED') {
        nodes.push(el('div', { class: 'card' }, [el('div', { class: 'msg ok', text: '⏳ ส่งสลิปแล้ว รอผู้เก็บตรวจสอบ' })]));
      } else {
        nodes.push(uploadCard(d));
      }
    }

    if (d.payments && d.payments.length) {
      nodes.push(el('div', { class: 'card' }, [el('div', { class: 'muted', text: 'ประวัติการส่งสลิป' })].concat(
        d.payments.map(function (p) {
          var label = { SUBMITTED: 'รอตรวจ', APPROVED: 'ยืนยันแล้ว', REJECTED: 'ไม่ยืนยัน' }[p.status] || p.status;
          return el('div', { class: 'row' }, [el('span', { text: '฿' + baht(p.amountSatang) }), el('span', { class: 'status-' + p.status, text: label })]);
        }))));
    }
    show(nodes);
  }

  function uploadCard(d) {
    var amount = el('input', { type: 'number', inputmode: 'decimal', step: '0.01', min: '0.01', value: (d.remainingSatang / 100).toFixed(2) });
    var file = el('input', { type: 'file', accept: 'image/*' });
    var out = el('div');
    var btn = el('button', { text: 'ส่งสลิป' });
    btn.addEventListener('click', function () {
      out.replaceChildren();
      var f = file.files && file.files[0];
      if (!f) { out.appendChild(el('div', { class: 'msg err', text: 'กรุณาแนบรูปสลิปก่อน' })); return; }
      btn.disabled = true; btn.textContent = 'กำลังส่ง…';
      shrink(f).then(function (blob) {
        var fd = new FormData();
        fd.append('billToken', billToken);
        fd.append('amount', amount.value);
        fd.append('file', blob, 'slip.jpg');
        return api(API + 'api/pay/slip', { method: 'POST', body: fd });
      }).then(function () { return load(); })
        .catch(function (e) {
          btn.disabled = false; btn.textContent = 'ส่งสลิป';
          out.appendChild(el('div', { class: 'msg err', text: e.message }));
        });
    });
    return el('div', { class: 'card' }, [
      el('div', { class: 'muted', text: 'จ่ายเสร็จแล้ว แนบสลิปที่นี่' }),
      el('label', { text: 'ยอดที่โอน (บาท)' }), amount,
      el('label', { text: 'รูปสลิป' }), file,
      btn, out
    ]);
  }

  function load() {
    return api(API + 'api/pay/' + encodeURIComponent(billToken)).then(function (d) {
      state = d;
      render();
    });
  }

  // Collector side: choose the group first, then tick the people in it. Used when the command named nobody.
  function loadPick() {
    return api(API + 'api/pay/pick').then(renderPick);
  }

  // Round profile picture (square for groups); falls back to the first letter when LINE gave none or it fails to load.
  function avatar(url, name, square) {
    var box = el('span', { class: 'avatar' + (square ? ' sq' : '') });
    function fallback() {
      box.replaceChildren();
      box.classList.add('ph');
      box.textContent = ((name || '?').trim().charAt(0) || '?').toUpperCase();
    }
    if (url) {
      var img = el('img', { src: url, alt: '', loading: 'lazy' });
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', fallback);
      box.appendChild(img);
    } else fallback();
    return box;
  }

  function renderPick(d) {
    function money(satang) { return '฿' + baht(Math.round(satang)); }
    var what = d.perPerson ? 'เก็บคนละ ' + money(d.amountSatang) : 'หาร ' + money(d.amountSatang) + ' ตามจำนวนคนที่เลือก';
    function head(sub) {
      return el('div', { class: 'card' }, [
        el('h1', { text: sub }),
        el('div', { class: 'muted', text: d.title }),
        el('div', { class: 'amount pick-amount', text: what })
      ]);
    }

    if (!d.groups.length) {
      show([head('เลือกคนที่จะเรียกเก็บ'), el('div', { class: 'card' }, [
        el('div', { class: 'muted', text: 'ยังไม่มีกลุ่มให้เลือก ชวนบอทเข้ากลุ่ม แล้วให้ทุกคนพิมพ์ข้อความทักทายในกลุ่มก่อน' })
      ])]);
      return;
    }

    // Step 1: pick the group (skipped when there is only one).
    function chooseGroup() {
      var cards = d.groups.map(function (g) {
        var row = el('button', { class: 'pick-row group-row' }, [
          avatar(g.pictureUrl, g.name, true),
          el('span', { class: 'grow' }, [
            el('strong', { text: g.name }),
            el('span', { class: 'muted block', text: g.members.length + ' คนที่บอทรู้จัก' })
          ]),
          el('span', { class: 'chev', text: '›' })
        ]);
        row.addEventListener('click', function () { choosePeople(g, d.groups.length > 1); });
        return row;
      });
      show([head('เลือกกลุ่ม'), el('div', { class: 'card' }, cards)]);
    }

    // Step 2: tick people inside that group.
    function choosePeople(group, canGoBack) {
      var selected = {};
      var rows = [];
      function ids() { return Object.keys(selected).filter(function (k) { return selected[k]; }).map(Number); }

      var summary = el('div', { class: 'muted' });
      var out = el('div');
      var dest = el('div');
      var destChoice = 'G:' + group.id;

      var search = el('input', { type: 'search', placeholder: 'ค้นหาชื่อ' });
      search.style.cssText = 'width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)';
      search.addEventListener('input', function () {
        var q = search.value.trim().toLowerCase();
        rows.forEach(function (r) { r.el.style.display = (!q || r.name.indexOf(q) >= 0) ? '' : 'none'; });
      });

      var list = el('div');
      group.members.forEach(function (p) {
        var cb = el('input', { type: 'checkbox' });
        var row = el('label', { class: 'pick-row' }, [
          avatar(p.pictureUrl, p.name, false),
          el('span', { class: 'grow', text: p.name }),
          cb
        ]);
        cb.addEventListener('change', function () { selected[p.id] = cb.checked; update(); });
        rows.push({ el: row, name: p.name.toLowerCase(), box: cb, id: p.id });
        list.appendChild(row);
      });
      if (!group.members.length) list.appendChild(el('div', { class: 'muted', text: 'บอทยังไม่รู้จักใครในกลุ่มนี้ ให้เพื่อนพิมพ์ข้อความทักทายในกลุ่มก่อน' }));

      var all = el('button', { class: 'secondary', text: 'เลือกทั้งหมด' });
      all.style.cssText = 'width:auto;margin:0;padding:6px 12px;font-size:14px';
      all.addEventListener('click', function () {
        var every = rows.length > 0 && rows.every(function (r) { return selected[r.id]; });
        rows.forEach(function (r) { selected[r.id] = !every; r.box.checked = !every; });
        update();
      });

      function update() {
        var n = ids().length;
        if (n === 0) summary.textContent = 'ยังไม่ได้เลือกใคร';
        else if (d.perPerson) summary.textContent = 'เลือก ' + n + ' คน × ' + money(d.amountSatang) + ' = ' + money(d.amountSatang * n);
        else summary.textContent = 'เลือก ' + n + ' คน หารคนละประมาณ ' + money(d.amountSatang / n);
      }

      // where to announce the bill
      dest.replaceChildren();
      [{ v: 'G:' + group.id, t: 'โพสต์การ์ดในกลุ่ม ' + group.name },
       { v: 'P', t: 'ส่งข้อความส่วนตัวหาแต่ละคน (ต้องเป็นเพื่อนกับบอท)' }].forEach(function (o) {
        var r = el('input', { type: 'radio', name: 'dest', value: o.v });
        r.checked = o.v === destChoice;
        r.addEventListener('change', function () { destChoice = o.v; });
        dest.appendChild(el('label', { class: 'row' }, [el('span', { text: o.t }), r]));
      });

      var go = el('button', { text: 'ถัดไป' });
      go.addEventListener('click', function () {
        out.replaceChildren();
        var picked = ids();
        if (picked.length === 0) { out.appendChild(el('div', { class: 'msg err', text: 'กรุณาเลือกอย่างน้อย 1 คน' })); return; }
        go.disabled = true; go.textContent = 'กำลังส่ง…';
        api(API + 'api/pay/pick', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userIds: picked, dest: destChoice }) })
          .then(function () {
            show([el('div', { class: 'card' }, [el('div', { class: 'msg ok', text: 'ส่งการ์ดยืนยันไปที่แชทแล้ว กลับไปกด "ยืนยัน" ในแชทกับบอท' })])]);
            if (window.liff && liff.isInClient && liff.isInClient()) setTimeout(function () { liff.closeWindow(); }, 1500);
          })
          .catch(function (e) {
            go.disabled = false; go.textContent = 'ถัดไป';
            out.appendChild(el('div', { class: 'msg err', text: e.message }));
          });
      });

      var groupBar = el('div', { class: 'card' }, [el('div', { class: 'pick-row static' }, [
        avatar(group.pictureUrl, group.name, true),
        el('span', { class: 'grow' }, [el('strong', { text: group.name }), el('span', { class: 'muted block', text: 'เลือกคนในกลุ่มนี้' })])
      ])]);
      if (canGoBack) {
        var back = el('button', { class: 'secondary', text: 'เปลี่ยนกลุ่ม' });
        back.style.cssText = 'width:auto;margin:0;padding:6px 12px;font-size:14px';
        back.addEventListener('click', chooseGroup);
        groupBar.firstChild.appendChild(back);
      }

      var peopleCard = el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [el('strong', { text: 'เลือกคน' }), all]), search, list
      ]);
      show([head('เลือกคนที่จะเรียกเก็บ'), groupBar, peopleCard, el('div', { class: 'card' }, [summary, dest, go, out])]);
      update();
    }

    if (d.groups.length === 1) choosePeople(d.groups[0], false); else chooseGroup();
  }

  fetch(API + 'api/pay/config').then(function (r) { return r.json(); }).then(function (cfg) {
    return liff.init({ liffId: cfg.liffId });
  }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    var q = new URLSearchParams(location.search);
    var st = q.get('liff.state') ? new URLSearchParams(q.get('liff.state').replace(/^\?/, '')) : null;
    billToken = q.get('b') || (st && st.get('b'));
    var mode = q.get('mode') || (st && st.get('mode'));
    if (!billToken && mode !== 'pick') { fail('ลิงก์ไม่ถูกต้อง'); return; }
    idToken = liff.getIDToken();
    if (!idToken) { fail('ไม่พบข้อมูลผู้ใช้ ลองเปิดจากแอป LINE อีกครั้ง'); return; }
    if (mode === 'pick') return loadPick();
    return load();
  }).catch(function (e) { fail(e.message || 'โหลดไม่สำเร็จ'); });
})();
</script>
</body>
</html>
