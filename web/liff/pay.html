<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
<title>PayYet</title>
<link rel="icon" type="image/png" href="../img/favicon-48.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e8eaed; --accent:#ff8a00; --on:#2b1400; --warn:#d9480f; --ok:#1a9c4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f24; --text:#e8eaed; --muted:#9aa3ad; --line:#2d333b; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
         -webkit-tap-highlight-color:transparent; padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.5; }

  /* top bar: back icon + title */
  .bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px; min-height:48px; background:var(--card); border-bottom:1px solid var(--line);
         padding:calc(6px + env(safe-area-inset-top)) max(12px, calc((100% - 560px) / 2 + 12px)) 6px; }
  .bar img { width:24px; height:24px; border-radius:7px; }
  .bar .ttl { flex:1; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 24px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  h1 { font-size:16px; margin:0; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .amount { font-size:clamp(28px,8vw,36px); font-weight:700; margin:2px 0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; }
  .grow { flex:1 1 auto; min-width:0; }
  .block { display:block; font-size:13px; }
  .pad { padding:4px 0; }
  .sub { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
  .preline { white-space:pre-line; }
  .qr { display:block; width:min(240px,70%); margin:8px auto 2px; border-radius:8px; background:#fff; }
  .hid { display:none; }

  /* icons */
  .ic { display:inline-flex; }
  .ic svg, .ib svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .ib { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; padding:0; border:0; border-radius:50%; background:transparent; color:var(--muted); flex:0 0 auto; }
  .ib:hover, .ib:active { background:rgba(128,128,128,.16); color:var(--text); }
  .ib.ok { color:var(--ok); } .ib.warn { color:var(--warn); } .ib.on { color:var(--accent); }
  .chip { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px 0 8px; border:1px solid var(--line); border-radius:18px; background:transparent; font-size:14px; }
  .chip:active { background:rgba(128,128,128,.16); }
  .chip.warn { color:var(--warn); border-color:var(--warn); }
  a.chip { text-decoration:none; color:var(--text); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .cta { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; min-height:44px; border:0; border-radius:22px; background:var(--accent); color:var(--on); font-weight:700; margin-top:10px; }

  /* list rows */
  .li { display:flex; align-items:center; gap:10px; width:100%; padding:8px 0; background:none; border:0; text-align:left; }
  .li + .li { border-top:1px solid var(--line); }
  button.li { cursor:pointer; }
  .tint { width:36px; height:36px; flex:0 0 36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:rgba(128,128,128,.14); color:var(--text); }
  .tint.accent { background:var(--accent); color:var(--on); }
  .chev { color:var(--muted); display:inline-flex; }
  .chev svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .avatar { width:36px; height:36px; flex:0 0 36px; border-radius:50%; overflow:hidden; background:var(--line); display:inline-flex; align-items:center; justify-content:center; }
  .avatar.sq { border-radius:10px; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.ph { font-weight:700; font-size:15px; background:#ffe9c7; color:#2b1400; }
  @media (prefers-color-scheme: dark) { .avatar.ph { background:#3b2810; color:var(--text); } }
  .li input[type=checkbox] { width:20px; height:20px; flex:0 0 auto; accent-color:var(--accent); }

  /* forms */
  label.fld { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .inp { width:100%; height:42px; padding:0 12px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  .inp.big { height:50px; font-size:24px; font-weight:700; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:10px; }
  .seg button { flex:1; height:34px; border:0; background:transparent; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .seg button.on { background:var(--accent); color:var(--on); font-weight:700; }
  .seg .ic svg { width:16px; height:16px; }
  .inp.amt { width:92px; height:34px; font-size:15px; text-align:right; padding:0 8px; }
  .cashform { display:flex; gap:6px; align-items:center; margin:2px 0 6px 46px; }
  .cashform .inp { width:120px; height:36px; font-size:15px; }

  .msg { padding:8px 12px; border-radius:10px; margin-top:10px; font-size:14px; }
  .msg.ok { background:rgba(26,156,74,.12); color:var(--ok); }
  .msg.err { background:rgba(217,72,15,.12); color:var(--warn); }
  .status-PAID { color:var(--ok); } .status-REJECTED { color:var(--warn); }
  .pill { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; font-weight:700; white-space:nowrap; }
  .pill.ok { background:rgba(26,156,74,.15); color:var(--ok); }
  .pill.wait { background:rgba(194,94,0,.15); color:#c25e00; }
  .pill.grey { background:rgba(120,120,120,.18); color:var(--muted); }
  .pill.due { background:rgba(217,72,15,.13); color:var(--warn); }
  @media (min-width:600px) { main { padding-top:20px; } .card { padding:16px; } }
</style>
</head>
<body>
<div class="bar"><span id="backSlot"></span><img src="../img/logo-256.webp" width="24" height="24" alt=""><span class="ttl" id="ttl">PayYet</span></div>
<main id="app"><div class="card muted">กำลังโหลด…</div></main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var API = 'https://api.drivetodev.online/'; // the API lives on its own subdomain (CORS allows this origin)
  var app = document.getElementById('app');
  var idToken = null, billToken = null, billId = null, state = null, payNotice = null;

  // Build DOM with textContent only: names and titles come from other users.
  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'class') e.className = props[k];
      else if (k === 'text') e.textContent = props[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function baht(satang) {
    var v = satang / 100;
    return v.toLocaleString('th-TH', { minimumFractionDigits: satang % 100 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function money(satang) { return '฿' + baht(Math.round(satang)); }
  function show(nodes) { app.replaceChildren.apply(app, nodes); window.scrollTo(0, 0); }
  function fail(text) { show([el('div', { class: 'card' }, [el('div', { class: 'msg err', text: text })])]); }

  // ───────── icons (constant SVG markup only, never user data) ─────────
  var ICONS = {
    back: '<path d="M15 18l-6-6 6-6"/>',
    chev: '<path d="M9 18l6-6-6-6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    cash: '<rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
    ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    all: '<path d="M3 7l3 3 5-6M3 17l3 3 5-6M14 8h7M14 18h7"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 5a3.5 3.5 0 010 7M18 14c2.5.7 3.5 2.7 3.5 6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/>',
    home: '<path d="M4 11l8-7 8 7v9H4z"/>',
    swap: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
    history: '<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    repeat: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/>',
    download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
    bell: '<path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    send: '<path d="M21 3L3 10l7 3 3 7z"/>',
    wallet: '<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 7l12-3v3M16 14h2"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2M12 17h.01"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function icon(name) { var s = el('span', { class: 'ic' }); s.innerHTML = svg(name); return s; }
  // Round icon-only button; the label stays available for screen readers and the long-press tooltip.
  function ibtn(name, label, onClick, cls) {
    var b = el('button', { class: 'ib' + (cls ? ' ' + cls : ''), type: 'button', 'aria-label': label, title: label });
    b.innerHTML = svg(name);
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }
  function chip(name, text, onClick, cls) {
    var b = el('button', { class: 'chip' + (cls ? ' ' + cls : ''), type: 'button' }, [icon(name), el('span', { text: text })]);
    b.addEventListener('click', onClick);
    return b;
  }
  function chev() { var s = el('span', { class: 'chev' }); s.innerHTML = svg('chev'); return s; }

  // Top bar: optional back icon on the left, screen title in the middle.
  function bar(title, onBack) {
    document.getElementById('ttl').textContent = title || 'PayYet';
    var slot = document.getElementById('backSlot');
    slot.replaceChildren();
    if (onBack) slot.appendChild(ibtn('back', 'กลับ', onBack));
  }
  function toHome() { return loadHome(); }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + idToken }, opts.headers || {});
    // Never leave a button spinning for ever: give up after 45 s (a bill may still have been created, say so).
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 45000) : null;
    if (ctl) opts.signal = ctl.signal;
    return fetch(path, opts).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var err = new Error(j.error || ('เกิดข้อผิดพลาด (' + r.status + ')')); err.data = j; throw err; }
        return j;
      });
    }, function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าผิดปกติ ตรวจในกลุ่มหรือแชทกับบอทก่อนว่าบิลถูกสร้างแล้วหรือยัง แล้วค่อยลองใหม่');
      throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่');
    });
  }
  function post(path, body) {
    return api(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }

  // Shrink the slip photo on the phone before upload (max 1600 px JPEG).
  function shrink(file) {
    if (!window.createImageBitmap) return Promise.resolve(file);
    return createImageBitmap(file).then(function (img) {
      var s = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (res) { c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.85); });
    }).catch(function () { return file; });
  }

  // ───────── pay page (opened from a bill card): every bill I owe, pick which ones to pay now ─────────
  var pay = { items: [], selected: {}, note: null };

  function load() {
    return api(API + 'api/pay/owed').then(function (list) {
      var firstLoad = pay.items.length === 0 && Object.keys(pay.selected).length === 0;
      pay.items = list;
      // keep only selections that are still payable
      Object.keys(pay.selected).forEach(function (t) {
        if (!list.some(function (i) { return i.billToken === t && i.status !== 'SUBMITTED'; })) delete pay.selected[t];
      });
      if (firstLoad) {
        // start with every bill of the collector whose bill was opened (one transfer pays one collector)
        var opened = list.filter(function (i) { return i.billToken === billToken; })[0];
        if (opened) list.forEach(function (i) { if (i.collectorId === opened.collectorId && i.status !== 'SUBMITTED') pay.selected[i.billToken] = true; });
      }
      renderPay();
    });
  }

  function sumOf(filterFn) { return pay.items.filter(filterFn).reduce(function (t, i) { return t + i.remainingSatang; }, 0); }
  function chosen() { return pay.items.filter(function (i) { return pay.selected[i.billToken]; }); }

  function renderPay() {
    bar('จ่ายเงิน');
    var nodes = [];
    var items = pay.items;
    var totalAll = sumOf(function () { return true; });

    if (!items.length) {
      nodes.push(el('div', { class: 'msg ok', text: '✅ ไม่มีบิลค้างจ่าย ขอบคุณครับ' }));
      if (pay.note) nodes.push(el('div', { class: 'msg ok', text: pay.note }));
      show(nodes);
      return;
    }

    nodes.push(el('div', { class: 'card' }, [
      el('div', { class: 'row' }, [el('span', { class: 'muted small', text: 'ยอดค้างทั้งหมด · ' + items.length + ' บิล' }), el('strong', { text: money(totalAll) })]),
      el('div', { class: 'muted small', text: 'เลือกบิลที่จะจ่ายตอนนี้ (โอนหนึ่งครั้งจ่ายได้เฉพาะบิลของผู้เก็บคนเดียวกัน)' })
    ]));

    // one card per collector
    var byCollector = {};
    items.forEach(function (i) { (byCollector[i.collectorId] = byCollector[i.collectorId] || []).push(i); });
    Object.keys(byCollector).forEach(function (cid) {
      var list = byCollector[cid];
      var rows = list.map(function (i) {
        var waiting = i.status === 'SUBMITTED';
        var cb = el('input', { type: 'checkbox' });
        cb.checked = !!pay.selected[i.billToken];
        cb.disabled = waiting;
        cb.addEventListener('change', function () {
          if (cb.checked) {
            // a different collector is a different transfer: switch the selection to this collector
            Object.keys(pay.selected).forEach(function (t) {
              var other = pay.items.filter(function (x) { return x.billToken === t; })[0];
              if (other && other.collectorId !== i.collectorId) delete pay.selected[t];
            });
            pay.selected[i.billToken] = true;
          } else delete pay.selected[i.billToken];
          pay.note = null;
          renderPay();
        });
        var sub = (i.groupName ? i.groupName : 'ส่วนตัว') + (i.paidSatang > 0 ? ' · จ่ายแล้ว ' + money(i.paidSatang) + ' จาก ' + money(i.amountSatang) : '');
        return el('label', { class: 'li' }, [cb,
          el('span', { class: 'grow' }, [el('strong', { text: i.title }), el('span', { class: 'muted block', text: sub })]),
          waiting ? pill('รอตรวจสลิป', 'wait') : el('strong', { text: money(i.remainingSatang) })]);
      });
      nodes.push(el('div', { class: 'card' }, [
        el('div', { class: 'li', style: 'padding-top:0' }, [avatar(list[0].collectorPictureUrl, list[0].collector, false),
          el('span', { class: 'grow' }, [el('strong', { text: 'จ่ายให้ ' + list[0].collector }),
            el('span', { class: 'muted block', text: list.length + ' บิล · รวม ' + money(list.reduce(function (t, i) { return t + i.remainingSatang; }, 0)) })])])
      ].concat(rows)));
    });

    nodes.push(payBox());
    if (pay.note) nodes.push(el('div', { class: 'msg ok', text: pay.note }));
    show(nodes);
    refreshQr();
  }

  // Selected total, the QR for it, and the slip upload.
  var qrBox = null, amountInput = null, qrTimer = null;

  function payBox() {
    var sel = chosen();
    var total = sel.reduce(function (t, i) { return t + i.remainingSatang; }, 0);
    qrBox = el('div', { class: 'muted small pad', text: sel.length ? 'กำลังสร้าง QR…' : '' });

    var head = el('div', { class: 'row' }, [
      el('span', { class: 'muted small', text: sel.length ? 'ยอดที่เลือก ' + sel.length + ' บิล' : 'ยังไม่ได้เลือกบิล' }),
      el('span', { class: 'amount', style: 'margin:0', text: money(total) })]);
    if (!sel.length) return el('div', { class: 'card' }, [head]);

    amountInput = el('input', { type: 'number', class: 'inp', inputmode: 'decimal', step: '0.01', min: '0.01', value: (total / 100).toFixed(2) });
    if (sel.length > 1) { amountInput.disabled = true; }       // several bills: pay exactly what they sum to
    else amountInput.addEventListener('input', function () { clearTimeout(qrTimer); qrTimer = setTimeout(refreshQr, 400); });

    var file = el('input', { type: 'file', accept: 'image/*', class: 'hid' });
    var pickLabel = el('span', { text: 'แนบสลิป' });
    var pickBtn = el('button', { class: 'chip', type: 'button' }, [icon('camera'), pickLabel]);
    pickBtn.addEventListener('click', function () { file.click(); });
    file.addEventListener('change', function () {
      pickLabel.textContent = file.files && file.files[0] ? 'เลือกรูปแล้ว' : 'แนบสลิป';
      pickBtn.classList.toggle('ok', !!(file.files && file.files[0]));
    });
    var out = el('div');
    var btn = el('button', { class: 'cta', type: 'button' }, [icon('send'), el('span', { text: 'ส่งสลิป' })]);
    var btnText = btn.lastChild;
    btn.addEventListener('click', function () {
      out.replaceChildren();
      var f = file.files && file.files[0];
      if (!f) { out.appendChild(el('div', { class: 'msg err', text: 'กรุณาแนบรูปสลิปก่อน' })); return; }
      btn.disabled = true; btnText.textContent = 'กำลังส่ง…';
      var tokens = chosen().map(function (i) { return i.billToken; });
      shrink(f).then(function (blob) {
        var fd = new FormData();
        fd.append('billTokens', tokens.join(','));
        fd.append('amount', amountInput.value);
        fd.append('file', blob, 'slip.jpg');
        return api(API + 'api/pay/slip-batch', { method: 'POST', body: fd });
      }).then(function (r) {
        pay.selected = {};
        pay.note = (r && r.message) || 'ส่งสลิปแล้ว รอผู้เก็บตรวจสอบ';
        return load();
      }).catch(function (e) {
        btn.disabled = false; btnText.textContent = 'ส่งสลิป';
        out.appendChild(el('div', { class: 'msg err', text: e.message }));
      });
    });

    return el('div', { class: 'card' }, [
      head,
      el('div', { class: 'muted small', text: 'สแกนด้วยแอปธนาคาร (กดค้างที่รูปเพื่อบันทึก QR) ยอดถูกใส่ให้อัตโนมัติ' }),
      qrBox,
      el('label', { class: 'fld', text: sel.length > 1 ? 'ยอดที่โอน (บาท) = ยอดรวมของบิลที่เลือก' : 'ยอดที่โอน (บาท) จ่ายบางส่วนได้' }), amountInput,
      el('div', { class: 'sub' }, [pickBtn, file]),
      btn, out
    ]);
  }

  function refreshQr() {
    var sel = chosen();
    if (!sel.length || !qrBox) return;
    var body = { billTokens: sel.map(function (i) { return i.billToken; }) };
    if (sel.length === 1 && amountInput && parseFloat(amountInput.value) > 0) body.amount = parseFloat(amountInput.value);
    var box = qrBox;
    post('api/pay/qr', body).then(function (r) {
      if (box !== qrBox) return;      // the selection changed meanwhile
      box.replaceChildren();
      if (r.qr) box.appendChild(el('img', { class: 'qr', src: r.qr, alt: 'PromptPay QR' }));
      else box.appendChild(el('div', { class: 'msg err', text: 'ผู้เก็บยังไม่ได้ตั้งพร้อมเพย์ ติดต่อผู้เก็บโดยตรง' }));
    }).catch(function (e) {
      if (box === qrBox) box.replaceChildren(el('div', { class: 'msg err', text: e.message }));
    });
  }

  // ───────── shared bits for the collector screens ─────────
  // Round profile picture (square for groups); falls back to the first letter when LINE gave none or it fails to load.
  function avatar(url, name, square) {
    var box = el('span', { class: 'avatar' + (square ? ' sq' : '') });
    function fallback() {
      box.replaceChildren();
      box.classList.add('ph');
      box.textContent = ((name || '?').trim().charAt(0) || '?').toUpperCase();
    }
    if (url) {
      var img = el('img', { src: url, alt: '', loading: 'lazy' });
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', fallback);
      box.appendChild(img);
    } else fallback();
    return box;
  }

  function pill(text, cls) { return el('span', { class: 'pill ' + cls, text: text }); }

  // Searchable checkbox list of one group's members. Each ticked person gets an editable amount box:
  // untouched boxes follow the default (equal split / full amount), edited ones are kept and the rest re-share what is left.
  function peopleBox(group, onChange) {
    var selected = {};
    var rows = [];
    function ids() { return Object.keys(selected).filter(function (k) { return selected[k]; }).map(Number); }
    function editedRows() { return rows.filter(function (r) { return selected[r.id] && r.edited; }); }

    var search = el('input', { type: 'search', placeholder: 'ค้นหาชื่อ', class: 'inp' });
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      rows.forEach(function (r) { r.el.style.display = (!q || r.name.indexOf(q) >= 0) ? '' : 'none'; });
    });

    var list = el('div');
    group.members.forEach(function (p) {
      var cb = el('input', { type: 'checkbox' });
      var amt = el('input', { type: 'number', class: 'inp amt', inputmode: 'decimal', step: '0.01', min: '0.01', 'aria-label': 'ยอดของ ' + p.name });
      amt.style.display = 'none';
      var row = el('label', { class: 'li' }, [avatar(p.pictureUrl, p.name, false), el('span', { class: 'grow', text: p.name }), amt, cb]);
      var r = { el: row, name: p.name.toLowerCase(), box: cb, amt: amt, id: p.id, edited: false };
      cb.addEventListener('change', function () { selected[p.id] = cb.checked; if (!cb.checked) r.edited = false; onChange(); });
      amt.addEventListener('click', function (e) { e.preventDefault(); });
      amt.addEventListener('input', function () { r.edited = amt.value !== ''; onChange(); });
      rows.push(r);
      list.appendChild(row);
    });
    if (!group.members.length) list.appendChild(el('div', { class: 'muted small pad', text: 'บอทยังไม่รู้จักใครในกลุ่มนี้ ให้เพื่อนพิมพ์ข้อความทักทายในกลุ่มก่อน' }));

    var all = ibtn('all', 'เลือกทั้งหมด', function () {
      var every = rows.length > 0 && rows.every(function (r) { return selected[r.id]; });
      rows.forEach(function (r) { selected[r.id] = !every; r.box.checked = !every; if (every) r.edited = false; });
      onChange();
    });
    var reset = ibtn('undo', 'ใช้ยอดเฉลี่ยทุกคน', function () { rows.forEach(function (r) { r.edited = false; }); onChange(); });
    reset.style.display = 'none';

    // Fill the amount boxes. totalBaht: the bill amount; perPerson: everyone pays it, otherwise it is shared.
    function refresh(totalBaht, perPerson) {
      var sel = rows.filter(function (r) { return selected[r.id]; });
      var keptSum = 0, free = [];
      sel.forEach(function (r) { if (r.edited) keptSum += parseFloat(r.amt.value) || 0; else free.push(r); });
      var each = perPerson ? totalBaht : (free.length ? Math.max(0, (totalBaht - keptSum) / free.length) : 0);
      free.forEach(function (r) { r.amt.value = each > 0 ? (Math.floor(each * 100 + 1e-6) / 100).toFixed(2) : ''; });
      rows.forEach(function (r) { r.amt.style.display = selected[r.id] && totalBaht > 0 ? '' : 'none'; });
      reset.style.display = editedRows().length ? '' : 'none';
    }
    function sum() { return rows.reduce(function (t, r) { return t + (selected[r.id] ? (parseFloat(r.amt.value) || 0) : 0); }, 0); }
    // null while nobody was edited: the server then splits equally by itself (exact to the satang).
    function amounts() {
      if (!editedRows().length) return null;
      var o = {};
      rows.forEach(function (r) { if (selected[r.id]) o[r.id] = parseFloat(r.amt.value) || 0; });
      return o;
    }

    var head = el('div', { class: 'row' }, [el('span', { class: 'muted small grow', text: 'เลือกคน · แตะยอดเพื่อแก้ไขรายคน' }), reset, all]);
    var root = el('div', { class: 'card' }, [head, search, list]);
    return { root: root, ids: ids, refresh: refresh, sum: sum, amounts: amounts, edited: function () { return editedRows().length > 0; } };
  }

  // Summary line under the form, shared by the picker and the new-bill form.
  function summaryText(box, totalBaht, perPerson) {
    var n = box.ids().length;
    if (n === 0) return 'ยังไม่ได้เลือกใคร';
    if (!(totalBaht > 0)) return 'เลือก ' + n + ' คน · ใส่ยอดเงินด้านบน';
    var t = 'เลือก ' + n + ' คน · รวม ' + money(box.sum() * 100);
    if (box.edited()) {
      t += ' · ปรับยอดรายคน';
      if (!perPerson && Math.abs(box.sum() - totalBaht) > 0.005) t += ' (ต่างจากยอดที่ตั้ง ' + money(Math.abs(box.sum() - totalBaht) * 100) + ')';
    } else if (!perPerson) t += ' · หารเท่ากัน';
    return t;
  }

  // Where the bill goes: the group chat, or private messages to each person. Chosen per bill.
  function destBox(group) {
    var choice = 'G:' + group.id;
    var hint = el('div', { class: 'muted small pad' });
    var opts = [
      { v: 'G:' + group.id, ic: 'users', t: 'ในกลุ่ม', h: 'โพสต์การ์ดในกลุ่ม ' + group.name },
      { v: 'P', ic: 'user', t: 'ส่วนตัว', h: 'ส่งข้อความหาแต่ละคน (ต้องเป็นเพื่อนกับบอท)' }
    ];
    var btns = opts.map(function (o) {
      var b = el('button', { type: 'button' }, [icon(o.ic), el('span', { text: o.t })]);
      b.addEventListener('click', function () { choice = o.v; sync(); });
      return b;
    });
    function sync() {
      opts.forEach(function (o, i) { btns[i].className = o.v === choice ? 'on' : ''; if (o.v === choice) hint.textContent = o.h; });
    }
    sync();
    return { root: el('div', {}, [el('div', { class: 'seg' }, btns), hint]), value: function () { return choice; } };
  }

  function groupBar(group, onChange) {
    var bar2 = el('div', { class: 'li' }, [
      avatar(group.pictureUrl, group.name, true),
      el('span', { class: 'grow' }, [el('strong', { text: group.name })])
    ]);
    if (onChange) bar2.appendChild(ibtn('swap', 'เปลี่ยนกลุ่ม', onChange));
    return el('div', { class: 'card' }, [bar2]);
  }

  function groupList(groups, onPick) {
    return el('div', { class: 'card' }, groups.map(function (g) {
      var row = el('button', { class: 'li', type: 'button' }, [
        avatar(g.pictureUrl, g.name, true),
        el('span', { class: 'grow' }, [el('strong', { text: g.name }), el('span', { class: 'muted block', text: g.members.length + ' คนที่บอทรู้จัก' })]),
        chev()
      ]);
      row.addEventListener('click', function () { onPick(g); });
      return row;
    }));
  }

  // ───────── picker opened from the chat command (หาร ... / เก็บ ...) ─────────
  function loadPick() {
    return api(API + 'api/pay/pick').then(renderPick);
  }

  function renderPick(d) {
    var what = d.perPerson ? 'เก็บคนละ ' + money(d.amountSatang) : 'หาร ' + money(d.amountSatang) + ' ตามจำนวนคนที่เลือก';
    function head() {
      return el('div', { class: 'card' }, [el('div', { class: 'muted small', text: d.title }), el('div', { class: 'amount', text: what })]);
    }

    if (!d.groups.length) {
      bar('เลือกคน');
      show([head(), el('div', { class: 'card' }, [
        el('div', { class: 'muted', text: 'ยังไม่มีกลุ่มให้เลือก ชวนบอทเข้ากลุ่ม แล้วให้ทุกคนพิมพ์ข้อความทักทายในกลุ่มก่อน' })])]);
      return;
    }

    function chooseGroup() { bar('เลือกกลุ่ม'); show([head(), groupList(d.groups, function (g) { choosePeople(g, d.groups.length > 1); })]); }

    function choosePeople(group, canGoBack) {
      bar('เลือกคน', canGoBack ? chooseGroup : null);
      var summary = el('div', { class: 'muted small' });
      var out = el('div');
      var box = peopleBox(group, update);
      var dest = destBox(group);

      function update() {
        box.refresh(d.amountSatang / 100, d.perPerson);
        summary.textContent = summaryText(box, d.amountSatang / 100, d.perPerson);
      }

      var go = el('button', { class: 'cta', type: 'button' }, [icon('check'), el('span', { text: 'สร้างบิล' })]);
      var goText = go.lastChild;
      go.addEventListener('click', function () {
        out.replaceChildren();
        var picked = box.ids();
        if (picked.length === 0) { out.appendChild(el('div', { class: 'msg err', text: 'กรุณาเลือกอย่างน้อย 1 คน' })); return; }
        var amts = box.amounts();
        if (amts && Object.keys(amts).some(function (k) { return !(amts[k] > 0); })) { out.appendChild(el('div', { class: 'msg err', text: 'ยอดของทุกคนต้องมากกว่า 0' })); return; }
        go.disabled = true; goText.textContent = 'กำลังสร้างบิล…';
        post('api/pay/pick', { userIds: picked, dest: dest.value(), amounts: amts })
          .then(renderCreated)
          .catch(function (e) {
            go.disabled = false; goText.textContent = 'สร้างบิล';
            out.appendChild(el('div', { class: 'msg err', text: e.message }));
          });
      });

      show([head(), groupBar(group, null), box.root, el('div', { class: 'card' }, [dest.root, el('div', { class: 'sub' }, [summary]), go, out])]);
      update();
    }

    var preset = d.groupId ? d.groups.filter(function (g) { return g.id === d.groupId; })[0] : null;
    if (preset) choosePeople(preset, d.groups.length > 1);
    else if (d.groups.length === 1) choosePeople(d.groups[0], false);
    else chooseGroup();
  }

  // ───────── manage: who has paid, cash, waive, cancel a charge or a whole bill ─────────
  var manageNotice = null;

  function openManage() { manageSel = null; return loadManage(); }

  function loadManage() {
    return api(API + 'api/manage').then(renderManage);
  }

  function manageAction(path, body, okText) {
    return post('api/manage/' + path, body)
      .then(function (r) { manageNotice = { ok: true, text: (r && r.message) || okText }; return loadManage(); })
      .catch(function (e) { manageNotice = { ok: false, text: e.message }; return loadManage(); });
  }

  var manageSel = null;   // id of the bill whose details are open (null = the list of bills)

  function renderManage(bills) {
    var open = manageSel == null ? null : bills.filter(function (x) { return x.id === manageSel; })[0];
    if (!open) manageSel = null;
    bar(open ? 'รายละเอียดบิล' : 'จัดการบิล', open ? function () { manageSel = null; renderManage(bills); } : toHome);

    var nodes = [];
    if (manageNotice) {
      nodes.push(el('div', { class: 'msg ' + (manageNotice.ok ? 'ok' : 'err'), text: manageNotice.text }));
      manageNotice = null;
    }
    if (open) { nodes.push(manageBill(open)); show(nodes); return; }

    if (!bills.length) nodes.push(el('div', { class: 'card muted', text: 'ตอนนี้ไม่มีบิลที่ยังเปิดอยู่ สั่งเก็บเงินใหม่ได้จากหน้าหลัก' }));
    else nodes.push(el('div', { class: 'card' }, bills.map(function (b) { return billRow(b, bills); })));
    show(nodes);
  }

  // One line per bill; tap to see who has paid and to manage it.
  function billRow(b, bills) {
    var done = b.items.filter(function (i) { return i.status === 'PAID' || i.status === 'WAIVED'; }).length;
    var left = b.totalSatang - b.paidSatang;
    var pending = b.items.some(function (i) { return i.status === 'SUBMITTED'; });
    var tag = pending ? pill('รอตรวจสลิป', 'wait') : left > 0 ? pill(money(left), 'due') : pill('ครบแล้ว', 'ok');
    var row = el('button', { class: 'li', type: 'button' }, [
      el('span', { class: 'tint' }, [icon(b.groupName ? 'users' : 'user')]),
      el('span', { class: 'grow' }, [el('strong', { text: b.title }),
        el('span', { class: 'muted block', text: (b.groupName ? b.groupName : 'ส่วนตัว') + ' · จ่ายแล้ว ' + done + '/' + b.items.length + ' คน' })]),
      tag, chev()
    ]);
    row.addEventListener('click', function () { manageSel = b.id; renderManage(bills); });
    return row;
  }

  function manageBill(b) {
    var cancel = ibtn('trash', 'ยกเลิกทั้งบิล', function () {
      if (!window.confirm('ยกเลิกทั้งบิล "' + b.title + '" ?\nทุกคนไม่ต้องจ่ายบิลนี้อีก (เงินที่รับไปแล้วระบบไม่ได้คืนให้)')) return;
      manageAction('cancel-bill', { id: b.id }, 'ยกเลิกบิลแล้ว');
    }, 'warn');
    var parts = [
      el('div', { class: 'row' }, [
        el('span', { class: 'grow' }, [el('strong', { text: b.title }),
          el('span', { class: 'muted block', text: (b.groupName ? 'กลุ่ม ' + b.groupName : 'ส่วนตัว') + ' · จ่ายแล้ว ฿' + baht(b.paidSatang) + ' จาก ฿' + baht(b.totalSatang) })]),
        cancel
      ])
    ];

    var chargeBox = el('div', { class: 'sub' });
    b.charges.forEach(function (c) { chargeBox.appendChild(chargeRow(b, c)); });
    parts.push(chargeBox);

    parts.push(el('div', { class: 'sub' }, [el('div', { class: 'row small muted' }, [icon('bell'), el('span', { class: 'grow', text: 'เตือนคนที่ยังไม่จ่าย' })]),
      remindSeg(b.remindEveryDays, function (days) { manageAction('reminder', { id: b.id, days: days }, 'ตั้งการเตือนแล้ว'); })]));

    var people = el('div', { class: 'sub' });
    b.items.forEach(function (i) { people.appendChild(manageItem(i)); });
    parts.push(people);
    return el('div', { class: 'card' }, parts);
  }

  // One charge of the bill: rename it, change each person's share, or cancel it.
  function chargeRow(b, c) {
    var holder = el('div');
    var head = el('div', { class: 'row small' });
    function view() {
      head.replaceChildren(el('span', { text: c.title + '  ฿' + baht(c.totalSatang) }));
      var tools = el('span', { class: 'chips', style: 'flex-wrap:nowrap;gap:0' });
      tools.appendChild(ibtn('edit', 'แก้ไขรายการ', edit));
      if (b.charges.length > 1) {
        tools.appendChild(ibtn('x', 'ยกเลิกรายการ', function () {
          if (!window.confirm('ยกเลิกรายการ "' + c.title + '" (฿' + baht(c.totalSatang) + ') ?\nยอดของทุกคนจะลดลงตามส่วนแบ่งของรายการนี้')) return;
          manageAction('cancel-charge', { id: c.id }, 'ยกเลิกรายการแล้ว');
        }));
      }
      head.appendChild(tools);
    }
    function edit() {
      holder.replaceChildren();
      var title = el('input', { type: 'text', class: 'inp', value: c.title, maxlength: '80', 'aria-label': 'ชื่อรายการ' });
      var fields = {};
      var rows = c.shares.map(function (sh) {
        var who = b.items.filter(function (i) { return i.id === sh.itemId; })[0];
        var inp = el('input', { type: 'number', class: 'inp amt', inputmode: 'decimal', step: '0.01', min: '0.01', value: (sh.amountSatang / 100).toFixed(2), 'aria-label': 'ยอดของ ' + (who ? who.name : '') });
        fields[sh.itemId] = { input: inp, original: sh.amountSatang };
        return el('div', { class: 'li' }, [avatar(who && who.pictureUrl, who ? who.name : '?', false), el('span', { class: 'grow', text: who ? who.name : '?' }), inp]);
      });
      var out = el('div');
      var save = ibtn('check', 'บันทึก', function () {
        var amounts = {}, changed = false;
        for (var k in fields) {
          var v = parseFloat(fields[k].input.value);
          if (!(v > 0)) { out.replaceChildren(el('div', { class: 'msg err', text: 'ยอดของทุกคนต้องมากกว่า 0' })); return; }
          if (Math.round(v * 100) !== fields[k].original) { amounts[k] = v; changed = true; }
        }
        var newTitle = title.value.trim();
        if (!changed && newTitle === c.title) { view(); holder.replaceChildren(); return; }
        save.disabled = true;
        manageAction('edit-charge', { id: c.id, title: newTitle === c.title ? null : newTitle, amounts: changed ? amounts : null }, 'แก้ไขแล้ว');
      }, 'ok');
      var cancel = ibtn('x', 'ยกเลิกการแก้ไข', function () { holder.replaceChildren(); });
      holder.appendChild(el('div', { class: 'card', style: 'margin:6px 0' }, [title, el('div', { class: 'pad' }), el('div', {}, rows),
        el('div', { class: 'row' }, [el('span', { class: 'muted small', text: 'แก้ยอดรายคนได้ ยอดรวมจะคำนวณใหม่' }), el('span', {}, [cancel, save])]), out]));
    }
    view();
    return el('div', {}, [head, holder]);
  }

  function manageItem(i) {
    var st;
    if (i.status === 'PAID') st = pill('จ่ายแล้ว', 'ok');
    else if (i.status === 'WAIVED') st = pill('ยกหนี้', 'grey');
    else if (i.status === 'SUBMITTED') st = pill('รอตรวจสลิป', 'wait');
    else st = pill('฿' + baht(i.remainingSatang) + (i.paidSatang > 0 ? ' (จ่ายแล้ว ฿' + baht(i.paidSatang) + ')' : ''), 'due');

    var line = el('div', { class: 'li' }, [avatar(i.pictureUrl, i.name, false), el('span', { class: 'grow', text: i.name }), st]);
    var wrap = el('div', {}, [line]);

    if (i.status === 'SUBMITTED') {
      var sl = i.slip;
      if (sl) {
        var view = el('a', { class: 'chip', href: sl.imageUrl, target: '_blank', rel: 'noopener' }, [icon('camera'), el('span', { text: 'ดูสลิป ' + money(sl.amountSatang) })]);
        line.appendChild(ibtn('check', 'ยืนยันรับเงิน', function () {
          if (!window.confirm('ยืนยันว่าได้รับเงิน ' + money(sl.amountSatang) + ' จาก ' + i.name + ' แล้ว?')) return;
          manageAction('approve-slip', { id: sl.id }, 'ยืนยันแล้ว');
        }, 'ok'));
        line.appendChild(ibtn('x', 'ปฏิเสธสลิป', function () {
          if (!window.confirm('ปฏิเสธสลิปของ ' + i.name + ' ?\nผู้จ่ายจะถูกแจ้งให้ส่งสลิปใหม่')) return;
          manageAction('reject-slip', { id: sl.id }, 'ปฏิเสธแล้ว');
        }, 'warn'));
        wrap.appendChild(el('div', { class: 'chips pad', style: 'margin-left:46px' }, [view].concat(sl.bankVerified ? [pill('ตรวจกับธนาคารแล้ว', 'ok')] : [])));
      } else {
        wrap.appendChild(el('div', { class: 'muted small', text: 'มีสลิปรอตรวจ' }));
      }
    } else if (i.status !== 'PAID' && i.status !== 'WAIVED') {
      var form = el('div', { class: 'cashform' });
      form.style.display = 'none';
      var amount = el('input', { type: 'number', class: 'inp', inputmode: 'decimal', step: '0.01', min: '0.01', value: (i.remainingSatang / 100).toFixed(2), 'aria-label': 'ยอดที่ได้รับ (บาท)' });
      var save = ibtn('check', 'บันทึกเงินสด', function () {
        var v = parseFloat(amount.value);
        if (!(v > 0)) { window.alert('กรุณาใส่ยอดที่ได้รับ'); return; }
        save.disabled = true;
        manageAction('paid', { itemId: i.id, amount: v }, 'บันทึกแล้ว');
      }, 'ok');
      form.appendChild(amount);
      form.appendChild(save);

      line.appendChild(ibtn('cash', 'รับเงินสดแล้ว', function () { form.style.display = form.style.display === 'none' ? '' : 'none'; }));
      line.appendChild(ibtn('ban', 'ยกหนี้', function () {

  // ───────── app screens: home, new bill, what I owe ─────────
  function promptPayCard(onSaved, required) {
    var input = el('input', { type: 'text', inputmode: 'numeric', placeholder: 'เบอร์มือถือ 10 หลัก / เลขบัตร 13 หลัก', class: 'inp', maxlength: '17' });

      out.replaceChildren();
      save.disabled = true;
      post('api/app/promptpay', { id: input.value })
        .then(function () { onSaved(); })
        .catch(function (e) {
          save.disabled = false;
          out.appendChild(el('div', { class: 'msg err', text: e.message }));
          if (e.data && e.data.needFriend && e.data.oaUrl) {
            var add = el('a', { class: 'chip', href: e.data.oaUrl, target: '_blank', rel: 'noopener' }, [icon('plus'), el('span', { text: 'เพิ่มเพื่อนบอท' })]);

    return el('div', { class: 'card' }, [
      el('strong', { text: required ? 'ตั้งพร้อมเพย์สำหรับรับเงินก่อน' : 'เปลี่ยนเลขพร้อมเพย์' }),

      el('div', { class: 'row sub' }, [el('span', { class: 'grow' }, [input]), save]), out
    ]);

  // One list row of the home screen: icon, title, one-line subtitle, chevron.
  function homeRow(ic, title, sub, primary, onClick) {
    var r = el('button', { class: 'li', type: 'button' }, [

  function loadHome() { return api(API + 'api/app/home').then(renderHome); }

  function renderHome(d) {
    bar('PayYet');
    var nodes = [];
    nodes.push(el('div', { class: 'li' }, [avatar(d.pictureUrl, d.name, false),

      homeRow('repeat', 'บิลประจำ', d.recurringCount > 0 ? d.recurringCount + ' รายการที่ทำซ้ำอัตโนมัติ' : 'สร้างบิลซ้ำทุกสัปดาห์/เดือน', false, function () { loadRecurring(); }),
      homeRow('history', 'ประวัติการจ่าย', 'สรุปบิลที่จ่ายแล้ว เลือกช่วงวันได้', false, function () { loadHistory(); }),
      homeRow('wallet', 'ตั้งค่า', d.hasPromptPay ? 'พร้อมเพย์ ' + (d.promptPayMasked || '') + ' · การเตือน' : 'ยังไม่ได้ตั้งพร้อมเพย์ · แตะเพื่อตั้งค่า', false, function () { loadPromptPay(); }),

  var REMIND_OPTIONS = [[1, 'ทุกวัน'], [3, 'ทุก 3 วัน'], [7, 'ทุกสัปดาห์'], [0, 'ปิด']];

  // Segmented control for "how often the bot reminds". onPick(days) is called with 0 / 1 / 3 / 7.
  function remindSeg(current, onPick) {
    var btns = REMIND_OPTIONS.map(function (o) {
      var b = el('button', { type: 'button', class: o[0] === current ? 'on' : '', text: o[1] });
      b.addEventListener('click', function () { onPick(o[0]); });
      return b;
    });
    return el('div', { class: 'seg' }, btns);
  }

  // ----- paid history: summary of settled bills for a date range (default last 30 days) -----
  var hist = { role: 'owe', from: null, to: null };

  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }

  function loadHistory() {
    if (!hist.to) { hist.to = daysAgo(0); hist.from = daysAgo(30); }
    var qs = '?role=' + hist.role + '&from=' + hist.from + '&to=' + hist.to;
    return api(API + 'api/app/history' + qs).then(renderHistory);
  }

  function renderHistory(d) {
    bar('ประวัติการจ่าย', toHome);
    var segOwe = el('button', { type: 'button', class: hist.role === 'owe' ? 'on' : '', text: 'ที่ฉันจ่าย' });
    var segGot = el('button', { type: 'button', class: hist.role === 'collected' ? 'on' : '', text: 'ที่ฉันเก็บได้' });
    segOwe.addEventListener('click', function () { hist.role = 'owe'; loadHistory(); });
    segGot.addEventListener('click', function () { hist.role = 'collected'; loadHistory(); });

    var from = el('input', { type: 'date', class: 'inp', value: hist.from, 'aria-label': 'ตั้งแต่วันที่' });
    var to = el('input', { type: 'date', class: 'inp', value: hist.to, 'aria-label': 'ถึงวันที่' });
    function apply() { if (from.value && to.value) { hist.from = from.value; hist.to = to.value; loadHistory(); } }
    from.addEventListener('change', apply);
    to.addEventListener('change', apply);
    function quick(label, days) { return chip('history', label, function () { hist.from = daysAgo(days); hist.to = daysAgo(0); loadHistory(); }); }

    var exportBtn = ibtn('download', 'ดาวน์โหลดเป็น CSV (เปิดใน Excel ได้)', function () {
      exportBtn.disabled = true;
      fetch(API + 'api/app/history/export?role=' + hist.role + '&from=' + hist.from + '&to=' + hist.to, { headers: { Authorization: 'Bearer ' + idToken } })
        .then(function (r) { if (!r.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ'); return r.blob(); })
        .then(function (blob) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'payyet-' + hist.from + '_' + hist.to + '.csv';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        })
        .catch(function (e) { window.alert(e.message); })
        .then(function () { exportBtn.disabled = false; });
    });

    var nodes = [
      el('div', { class: 'card' }, [
        el('div', { class: 'seg', style: 'margin-top:0' }, [segOwe, segGot]),
        el('div', { class: 'row sub' }, [from, el('span', { class: 'muted', text: '–' }), to]),
        el('div', { class: 'chips pad' }, [quick('7 วัน', 7), quick('30 วัน', 30), quick('3 เดือน', 90)])
      ]),
      el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [el('span', { class: 'muted small', text: (hist.role === 'owe' ? 'จ่ายไปทั้งหมด' : 'ได้รับทั้งหมด') + ' · ' + d.count + ' รายการ' }), d.count ? exportBtn : null]),
        el('div', { class: 'amount', text: money(d.totalSatang) })
      ])
    ];

    if (!d.items.length) nodes.push(el('div', { class: 'card muted', text: 'ไม่มีรายการในช่วงวันที่นี้' }));
    else nodes.push(el('div', { class: 'card' }, d.items.map(function (i) {
      var sub = (hist.role === 'owe' ? 'ให้ ' : 'จาก ') + i.name + (i.groupName ? ' · ' + i.groupName : '') + ' · ' + i.paidAt;
      var row = el('div', { class: 'li' }, [avatar(i.pictureUrl, i.name, false),
        el('span', { class: 'grow' }, [el('strong', { text: i.title }), el('span', { class: 'muted block', text: sub })]),
        el('strong', { text: money(i.amountSatang) }),
        ibtn('info', 'ดูรายละเอียดบิล', function () { loadBillDetail(i.billId); })]);
      return row;
    })));
    if (d.count >= 500) nodes.push(el('div', { class: 'muted small', text: 'แสดง 500 รายการล่าสุด ลดช่วงวันเพื่อดูให้ครบ' }));
    show(nodes);
  }

  // ----- one bill in full (opened from the history list) -----
  var STATUS_LABEL = { PAID: ['จ่ายแล้ว', 'ok'], WAIVED: ['ยกหนี้', 'grey'], SUBMITTED: ['รอตรวจสลิป', 'wait'], PENDING: ['ค้างจ่าย', 'due'], REJECTED: ['ค้างจ่าย', 'due'] };

  // fromCard: opened from a bill card in chat, so "back" goes to the home screen instead of the history list
  function loadBillDetail(id, fromCard) { return api(API + 'api/app/bill/' + id).then(function (d) { renderBillDetail(d, fromCard); }); }

  function renderBillDetail(d, fromCard) {
    bar('รายละเอียดบิล', fromCard ? toHome : function () { loadHistory(); });
    var st = { OPEN: 'เปิดอยู่', CLOSED: 'ปิดแล้ว', CANCELLED: 'ยกเลิกแล้ว' }[d.status] || d.status;
    var nodes = [el('div', { class: 'card' }, [
      el('div', { class: 'li', style: 'padding-top:0' }, [avatar(d.collector.pictureUrl, d.collector.name, false),
        el('span', { class: 'grow' }, [el('strong', { text: d.title }),
          el('span', { class: 'muted block', text: 'เก็บโดย ' + d.collector.name + (d.groupName ? ' · ' + d.groupName : ' · ส่วนตัว') })]),
        pill(st, d.status === 'OPEN' ? 'wait' : d.status === 'CLOSED' ? 'ok' : 'grey')]),
      el('div', { class: 'row sub' }, [el('span', { class: 'muted', text: 'สร้างเมื่อ ' + d.createdAt }), el('span', { text: 'จ่ายแล้ว ' + money(d.paidSatang) + ' / ' + money(d.totalSatang) })])
    ])];

    nodes.push(el('div', { class: 'card' }, [el('div', { class: 'muted small', text: 'รายการในบิล' })].concat(d.charges.map(function (c) {
      var right = c.myShareSatang != null ? 'ส่วนของฉัน ' + money(c.myShareSatang) + ' จาก ' + money(c.totalSatang) : money(c.totalSatang);
      return el('div', { class: 'row' }, [el('span', { text: c.title }), el('span', { class: 'muted', text: right })]);
    }))));

    nodes.push(el('div', { class: 'card' }, [el('div', { class: 'muted small', text: 'คนที่ต้องจ่าย' })].concat(d.items.map(function (i) {
      var s = STATUS_LABEL[i.status] || [i.status, 'grey'];
      return el('div', { class: 'li' }, [avatar(i.pictureUrl, i.name, false),
        el('span', { class: 'grow' }, [el('strong', { text: i.name + (i.isMe ? ' (ฉัน)' : '') }),
          el('span', { class: 'muted block', text: 'จ่ายแล้ว ' + money(i.paidSatang) + ' จาก ' + money(i.amountSatang) })]),
        pill(s[0], s[1])]);
    }))));

    if (d.payments.length) {
      nodes.push(el('div', { class: 'card' }, [el('div', { class: 'muted small', text: 'ประวัติการจ่าย' })].concat(d.payments.map(function (p) {
        return el('div', { class: 'row small' }, [el('span', { text: p.at + ' · ' + p.name + ' · ' + p.method }), el('strong', { text: money(p.amountSatang) })]);
      }))));
    }
    show(nodes);
  }

  function renderRecurring(list) {
    bar('บิลประจำ', toHome);
    var nodes = [];

    list.forEach(function (r) {
      var toggle = ibtn(r.active ? 'check' : 'repeat', r.active ? 'หยุดชั่วคราว' : 'เปิดใช้งาน', function () {
        post('api/app/recurring/toggle', { id: r.id }).then(loadRecurring).catch(function (e) { note.replaceChildren(el('div', { class: 'msg err', text: e.message })); });
      }, r.active ? 'ok' : '');

      ]));
    });
    nodes.push(note);
    show(nodes);
  }

  function loadNew() { return api(API + 'api/app/new').then(renderNew); }

  function renderNew(d) {
    bar('เก็บเงินใหม่', toHome);

    if (!d.hasPromptPay) { show([promptPayCard(function () { loadNew(); }, true)]); return; }
    if (!d.groups.length) {
      show([el('div', { class: 'card muted', text: 'ยังไม่มีกลุ่มให้เลือก ชวนบอทเข้ากลุ่ม แล้วให้ทุกคนพิมพ์ข้อความทักทายในกลุ่มก่อน' })]);
      return;
    }

    function chooseGroup() {
      bar('เลือกกลุ่ม', toHome);
      show([groupList(d.groups, function (g) { form(g, d.groups.length > 1); })]);
    }

    function form(group, canGoBack) {
      bar('เก็บเงินใหม่', canGoBack ? chooseGroup : toHome);
      var perPerson = false;      // false = split a total, true = each person pays the amount
      var repeat = '';            // '' | 'weekly' | 'monthly'
      var title = el('input', { type: 'text', class: 'inp', placeholder: 'ชื่อรายการ เช่น ค่าข้าว', maxlength: '80', 'aria-label': 'ชื่อรายการ' });
      var amount = el('input', { type: 'number', class: 'inp big', inputmode: 'decimal', step: '0.01', min: '0.01', placeholder: '฿ 0.00', 'aria-label': 'ยอดเงิน (บาท)' });
      var summary = el('div', { class: 'muted small' });
      var out = el('div');
      var box = peopleBox(group, update);
      var dest = destBox(group);

      var segSplit = el('button', { class: 'on', type: 'button', text: 'หารยอดรวม' });
      var segEach = el('button', { type: 'button', text: 'เก็บคนละ' });
      function setMode(each) {
        perPerson = each;
        segSplit.className = each ? '' : 'on';
        segEach.className = each ? 'on' : '';
        update();
      }
      segSplit.addEventListener('click', function () { setMode(false); });
      segEach.addEventListener('click', function () { setMode(true); });
      amount.addEventListener('input', update);

      function update() {
        var v = parseFloat(amount.value) || 0;
        box.refresh(v, perPerson);
        summary.textContent = summaryText(box, v, perPerson);
      }

      var repeatBtns = [['', 'ครั้งเดียว'], ['weekly', 'ทุกสัปดาห์'], ['monthly', 'ทุกเดือน']].map(function (o) {
        var b = el('button', { type: 'button', class: o[0] === repeat ? 'on' : '', text: o[1] });
        b.addEventListener('click', function () {
          repeat = o[0];
          repeatBtns.forEach(function (x, i) { x.className = ['', 'weekly', 'monthly'][i] === repeat ? 'on' : ''; });
        });
        return b;
      });
      var repeatRow = el('div', {}, [el('div', { class: 'row small muted' }, [icon('repeat'), el('span', { class: 'grow', text: 'ทำซ้ำอัตโนมัติ' })]), el('div', { class: 'seg' }, repeatBtns)]);

      var go = el('button', { class: 'cta', type: 'button' }, [icon('check'), el('span', { text: 'สร้างบิล' })]);
      var goText = go.lastChild;
      go.addEventListener('click', function () {
        out.replaceChildren();
        var picked = box.ids();
        var v = parseFloat(amount.value);
        if (!(v > 0)) { out.appendChild(el('div', { class: 'msg err', text: 'กรุณาใส่ยอดเงิน' })); return; }
        if (picked.length === 0) { out.appendChild(el('div', { class: 'msg err', text: 'กรุณาเลือกอย่างน้อย 1 คน' })); return; }
        var amts = box.amounts();
        if (amts && Object.keys(amts).some(function (k) { return !(amts[k] > 0); })) { out.appendChild(el('div', { class: 'msg err', text: 'ยอดของทุกคนต้องมากกว่า 0' })); return; }
        go.disabled = true; goText.textContent = 'กำลังสร้างบิล…';
        post('api/app/create', { title: title.value, amount: v, perPerson: perPerson, userIds: picked, dest: dest.value(), amounts: amts, repeat: repeat || null })
          .then(renderCreated)
          .catch(function (e) {
            go.disabled = false; goText.textContent = 'สร้างบิล';
            out.appendChild(el('div', { class: 'msg err', text: e.message }));
          });
      });

      show([
        groupBar(group, canGoBack ? chooseGroup : null),
        el('div', { class: 'card' }, [title, el('div', { class: 'pad' }), amount, el('div', { class: 'seg' }, [segSplit, segEach])]),
        box.root,
        el('div', { class: 'card' }, [dest.root, el('div', { class: 'sub' }, [repeatRow]), el('div', { class: 'sub' }, [summary]), go, out])
      ]);
      update();
    }

    if (d.groups.length === 1) form(d.groups[0], false); else chooseGroup();
  }

  function renderCreated(res) {
    bar('สร้างบิลแล้ว');
    var out = el('div');
    var parts = [el('div', { class: 'msg ok preline', text: res.summary }), el('div', { class: 'muted small pad', text: 'ยกเลิกได้ภายใน 10 นาที ถ้ายังไม่มีใครจ่าย' })];
    var undoRow = el('div', { class: 'chips' });
    (res.undo || []).forEach(function (u) {
      var b = chip('undo', u.label, function () {
        if (!window.confirm('ยกเลิก: ' + u.label + ' ?')) return;
        b.disabled = true;
        post('api/app/undo', { chargeId: u.chargeId })
          .then(function (r) { out.replaceChildren(el('div', { class: 'msg ok', text: (r && r.message) || 'ยกเลิกแล้ว' })); })
          .catch(function (e) { b.disabled = false; out.replaceChildren(el('div', { class: 'msg err', text: e.message })); });
      }, 'warn');
      undoRow.appendChild(b);
    });
    if (undoRow.childNodes.length) parts.push(undoRow);
    parts.push(out);

    show([el('div', { class: 'card' }, parts),
      el('div', { class: 'chips' }, [chip('plus', 'สร้างอีก', loadNew), chip('list', 'จัดการบิล', openManage), chip('home', 'หน้าหลัก', loadHome)])]);
  }

  // ----- what I owe -----
  function loadOwe() { return api(API + 'api/app/owe').then(renderOwe); }

  function renderOwe(list) {
    bar('ที่ฉันต้องจ่าย', toHome);
    if (!list.length) { show([el('div', { class: 'card muted', text: 'ไม่มีรายการค้างจ่าย 🎉' })]); return; }
    var nodes = [];
    list.forEach(function (i) {
      var status = i.status === 'SUBMITTED' ? pill('รอตรวจสลิป', 'wait') : pill(money(i.remainingSatang), 'due');
      var sub = 'เก็บโดย ' + i.collector + (i.paidSatang > 0 ? ' · จ่ายแล้ว ' + money(i.paidSatang) + ' จาก ' + money(i.amountSatang) : '');
      var row = el('button', { class: 'li', type: 'button' }, [avatar(i.collectorPictureUrl, i.collector, false),
        el('span', { class: 'grow' }, [el('strong', { text: i.title }), el('span', { class: 'muted block', text: sub })]), status, chev()]);
      row.addEventListener('click', function () { window.location.href = window.location.pathname + '?b=' + encodeURIComponent(i.billToken); });
      nodes.push(row);
    });
    show([el('div', { class: 'card' }, nodes)]);
  }

  // Startup diagnostics: name the step the page is on, show any script error, and never sit on "loading" without saying where.
  var stepName = 'เริ่มต้น';
  function step(n) {
    stepName = n;
    var f = app.firstElementChild;
    if (f && f.classList.contains('muted') && /กำลังโหลด/.test(f.textContent)) f.textContent = 'กำลังโหลด… (' + n + ')';
  }
  window.addEventListener('error', function (e) { fail('เกิดข้อผิดพลาดในหน้า: ' + (e.message || '') + ' [ขั้น: ' + stepName + ']'); });
  window.addEventListener('unhandledrejection', function (e) { fail('เกิดข้อผิดพลาด: ' + ((e.reason && e.reason.message) || e.reason || '') + ' [ขั้น: ' + stepName + ']'); });
  setTimeout(function () {
    var f = app.firstElementChild;
    if (f && f.classList.contains('muted') && /กำลังโหลด/.test(f.textContent)) fail('โหลดไม่สำเร็จ ค้างที่ขั้น: ' + stepName + ' ลองปิดแล้วเปิดใหม่จากเมนู');
  }, 15000);

  step('ดึงค่าตั้งค่า');
  fetch(API + 'api/pay/config').then(function (r) { return r.json(); }).then(function (cfg) {
    step('เชื่อมต่อ LINE');
    return liff.init({ liffId: cfg.liffId });
  }).then(function () {
    step('ตรวจการล็อกอิน');
    if (!liff.isLoggedIn()) { liff.login(); return; }
    var q = new URLSearchParams(location.search);
    var st = q.get('liff.state') ? new URLSearchParams(q.get('liff.state').replace(/^\?/, '')) : null;
    billToken = q.get('b') || (st && st.get('b'));
    var mode = q.get('mode') || (st && st.get('mode'));
    billId = q.get('id') || (st && st.get('id'));
    if (!billToken && ['pick', 'manage', 'new', 'owe', 'home', 'promptpay', 'help', 'history', 'recurring', 'bill'].indexOf(mode) < 0) mode = 'home';
    idToken = liff.getIDToken();
    step('โหลดข้อมูล (' + (mode || 'บิล') + ')');
    if (!idToken) { fail('ไม่พบข้อมูลผู้ใช้ ลองเปิดจากแอป LINE อีกครั้ง'); return; }
    if (mode === 'pick') return loadPick();
    if (mode === 'manage') return openManage();
    if (mode === 'new') return loadNew();
    if (mode === 'owe') return loadOwe();
    if (mode === 'home') return loadHome();
    if (mode === 'bill' && /^[0-9]+$/.test(billId || '')) return loadBillDetail(billId, true);
    if (mode === 'recurring') return loadRecurring();
    if (mode === 'history') return loadHistory();
    if (mode === 'promptpay') return loadPromptPay();
    if (mode === 'help') return renderHelp();
    return load();
  }).catch(function (e) { fail(e.message || 'โหลดไม่สำเร็จ'); });
})();
</script>
</body>
</html>
